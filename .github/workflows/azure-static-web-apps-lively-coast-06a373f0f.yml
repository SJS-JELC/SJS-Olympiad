name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  validate:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    uses: ./.github/workflows/validation.yml
    with:
      full_browser: ${{ github.event_name == 'pull_request' }}

  build_and_deploy_job:
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Require validated frontend artifact ID
        env:
          FRONTEND_ARTIFACT_ID: ${{ needs.validate.outputs.frontend_artifact_id }}
        run: |
          [[ "$FRONTEND_ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "Validation did not return a frontend artifact ID." >&2; exit 1; }
      - name: Download validated frontend
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.validate.outputs.frontend_artifact_id }}
          path: dist
          merge-multiple: true
      - name: Verify validated frontend files
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -type f -print -quit)"
          test -f dist/staticwebapp.config.json
      - name: Select managed API Node version
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production API dependencies
        run: npm ci --omit=dev --prefix api
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_COAST_06A373F0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          # Upload prepared files; do not invoke Oryx SDK discovery/builds.
          app_location: "dist"
          api_location: "api"
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_COAST_06A373F0F }}
          action: "close"
