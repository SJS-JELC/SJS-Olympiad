name: Olympiad validation

on:
  workflow_call:
    inputs:
      full_browser:
        description: Run the full browser suite instead of the deployment smoke suite
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      full_browser:
        description: Run the full browser suite instead of the deployment smoke suite
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build and audit production site
        run: npm run build
      - run: node --test api/tests/*.test.mjs
      - run: npm test
      - run: npm run test:contracts
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Full browser regression suite
        if: inputs.full_browser
        run: npm run test:browser
      - name: Deployment browser smoke suite
        if: ${{ !inputs.full_browser }}
        run: npm run test:browser:smoke
